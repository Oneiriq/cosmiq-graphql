name: Code Check

on:
  workflow_call:

jobs:
  code_quality:
    # Reusable workflow — inherits the caller's trigger context. When
    # called from ci.yml on a fork PR, route to ubuntu-latest so PR
    # code never executes on aur0. Other callers (release.yml,
    # workflow_dispatch) see null `pull_request` and pick aur0.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted", "aur0"]') }}
    strategy:
      matrix:
        # Exact pin: `deno doc --lint` chases type references into npm
        # dependencies on 2.8+ AND on 2.7 patches after 2.7.4 (2.7.14
        # confirmed affected) — a public API that exposes @azure/cosmos
        # types (Container, CosmosClient) cannot satisfy private-type-ref;
        # re-exporting them just cascades into the SDK's own internals.
        # 2.7.4 is the newest release where the gate is satisfiable.
        # Re-evaluate when the rule learns to treat external packages as
        # documented elsewhere.
        deno-version: ['2.7.4']
    steps:
      - uses: actions/checkout@v4
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ matrix.deno-version }}
      - name: Check formatting
        run: deno fmt --check
      - name: Lint (Code)
        run: deno lint
      - name: Lint (JSDoc)
        run: deno doc --lint mod.ts
      - name: Type check
        run: deno check mod.ts
